<!DOCTYPE html>
<script type="module">
import { auth } from "./firebase.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

window.go = async function(){
  let u = document.getElementById('u').value.trim();
  let p = document.getElementById('p').value.trim();
  let btn = document.getElementById('btn');
  let info = document.getElementById('info');

  if(!u || !p){ alert('Username aur password dalo'); return; }

  btn.innerText="CHECKING...";
  info.innerText="Verifying with Firebase Auth...";

  try {
    // Username ki jagah email bhi allow hai
    let email = u.includes('@') ? u : 'admin@aura.io';
    
    const userCred = await signInWithEmailAndPassword(auth, email, p);
    
    localStorage.setItem('aura_current', JSON.stringify({
      username: 'admin', 
      name: 'ADMIN', 
      email: userCred.user.email,
      uid: userCred.user.uid
    }));
    
    info.innerText="Success! Redirecting...";
    location.href='admin.html';

  } catch (error) {
    console.log(error);
    alert('Login Failed: ' + error.message);
    btn.innerText="ENTER ADMIN";
    info.innerText="Wrong password or user not found";
  }
}

document.getElementById('info').innerText="Secure Access • Ready";
</script>
