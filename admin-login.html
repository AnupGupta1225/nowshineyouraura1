<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login - Aura</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#07030f url('bg.jpg') center/cover no-repeat;
  min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;
}
.card{
  width:380px;background:rgba(15,10,30,.78);backdrop-filter:blur(18px);
  border:1px solid rgba(168,85,247,.6);border-radius:16px;
  padding:24px;color:#fff;box-shadow:0 0 30px rgba(168,85,247,.4);
}
.logo{font-family:Orbitron;color:#a78bfa;text-align:center;font-size:18px;margin-bottom:18px;letter-spacing:1.5px}
input{
  width:100%;height:44px;background:rgba(255,255,255,.07);
  border:1px solid rgba(168,85,247,.45);border-radius:10px;
  color:#fff;padding:0 14px;margin-bottom:12px;outline:none;
}
input:focus{border-color:#a855f7}
.btn{
  width:100%;height:46px;background:linear-gradient(180deg,#7c3aed,#4c1d95);
  border:1px solid #a855f7;border-radius:12px;color:#fff;font-weight:700;
  cursor:pointer;font-family:Orbitron;
}
</style>
</head><body>
<div class="card">
<div class="logo">✦ AURA ADMIN</div>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button class="btn" id="btn" onclick="go()">ENTER ADMIN</button>
<p id="info" style="text-align:center;margin-top:12px;font-size:11px;color:#8b7aa8">Connecting...</p>
</div>

<script type="module">
import { db, doc, getDoc, setDoc } from "./firebase.js";

async function getAdminCred(){
  let ref = doc(db, "settings", "admin");
  let snap = await getDoc(ref);
  if(!snap.exists()){
    let c={username:'admin', email:'admin@aura.io', password:'anup123'};
    await setDoc(ref, c);
    return c;
  }
  return snap.data();
}

let credCache=null;
(async()=>{
  credCache=await getAdminCred();
  document.getElementById('info').innerText="Ready • Default: admin / anup123";
})();

window.go = async function(){
  let u = document.getElementById('u').value.trim();
  let p = document.getElementById('p').value.trim();
  let btn=document.getElementById('btn');
  btn.innerText="CHECKING...";
  let cred = credCache || await getAdminCred();
  if( (u===cred.username || u===cred.email) && p===cred.password ){
    localStorage.setItem('aura_current', JSON.stringify({username:'admin', name:'ADMIN', email:cred.email}));
    location.href='admin.html';
  } else {
    alert('Wrong username or password');
    btn.innerText="ENTER ADMIN";
  }
}
</script>
</body></html>
