<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOWSHINEYOURAURA</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-end;background:#07030f url('bg.jpg') center top/cover no-repeat fixed;font-family:'Inter',sans-serif;padding:0 16px 32px}
.card{width:410px;max-width:95vw;background:rgba(15,10,30,0.52);backdrop-filter:blur(18px);border-radius:16px;padding:22px 22px 16px;border:1.2px solid rgba(168,85,247,0.75);box-shadow:0 0 22px rgba(168,85,247,0.7);position:relative;margin-top:38vh}
.logo{display:flex;align-items:center;gap:9px;font-family:'Orbitron',sans-serif;color:#b98eff;font-size:19.5px;font-weight:700;text-shadow:0 0 14px #a855f7;cursor:pointer;user-select:none}
.logo i{font-style:normal;font-size:28px;color:#e9d5ff}
.sub{color:#c4b5fd;text-align:center;font-size:13px;margin:5px 0 18px}
.lbl{color:#f5f3ff;font-size:12.5px;margin:12px 0 6px 2px}
.box{height:42px;background:rgba(255,255,255,0.07);border:1px solid rgba(168,85,247,0.45);border-radius:8px;display:flex;align-items:center;gap:10px;padding:0 12px}
.box input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:13px}
.box input::placeholder{color:#9b8ab8}
.row{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 16px}
.chk{display:flex;align-items:center;gap:7px;color:#ddd6fe;font-size:12.5px}
.chk input{width:14px;height:14px;accent-color:#7c3aed}
.forgot{color:#a78bfa;font-size:12px;text-decoration:none;border-bottom:1px solid #a78bfa}
.btn{width:62%;height:44px;margin:0 auto;display:block;background:linear-gradient(180deg,#6d28d9,#4c1d95);border:1px solid #a855f7;border-radius:10px;color:#fff;font-size:15px;font-weight:600;box-shadow:0 0 14px rgba(168,85,247,.85);cursor:pointer}
.or{display:flex;align-items:center;gap:12px;color:#8b7aa8;font-size:11.5px;margin:16px 0 12px}
.or::before,.or::after{content:'';flex:1;height:1px;background:#3a3250}
.bot{color:#e9e5ff;text-align:center;font-size:12.5px}
.bot a{color:#a78bfa;border-bottom:1px solid #a78bfa;text-decoration:none;margin-left:4px;cursor:pointer}
.err{display:none;margin-top:10px;background:rgba(42,18,24,.88);border:1px solid #5a2a30;color:#ffb4b4;padding:7px;border-radius:8px;font-size:11px;text-align:center}
.err.show{display:block}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
<div id="loginBox">
<div class="logo" id="secretLogo"><i>✦</i> NOWSHINEYOURAURA</div>
<div class="sub">Welcome Back • Sign in to continue</div>
<div class="lbl">Email</div><div class="box"><input id="email" type="email" placeholder="you@example.com"></div>
<div class="lbl">Password</div><div class="box"><input id="password" type="password" placeholder="Password "></div>
<div class="row"><label class="chk"><input type="checkbox"> Remember me</label><a class="forgot" href="#">Forgot Password?</a></div>
<button class="btn" onclick="login()">Login</button>
<div id="loginErr" class="err"></div>
<div class="or">OR</div>
<div class="bot">Don't have an account? <a onclick="showSignup()">Sign Up</a></div>
</div>
<div id="signupBox" class="hidden">
<div class="logo"><i>✦</i> NOWSHINEYOURAURA</div>
<div class="sub">Create Account • Shine your aura</div>
<div class="lbl">Full Name</div><div class="box"><input id="s_name" placeholder="Name"></div>
<div class="lbl">Username</div><div class="box"><input id="s_user" placeholder="nowshine_123"></div>
<div class="lbl">Mobile No</div><div class="box"><input id="s_mobile" placeholder="10 digit mobile"></div>
<div class="lbl">Email</div><div class="box"><input id="s_email" placeholder="you@example.com"></div>
<div class="lbl">Password</div><div class="box"><input id="s_pass" type="password" placeholder="Min 6 characters"></div>
<button class="btn" style="margin-top:16px" onclick="signup()">Sign Up</button>
<div id="signupErr" class="err"></div>
<div class="or">OR</div>
<div class="bot">Already have an account? <a onclick="showLogin()">Login</a></div>
</div>
</div>

<script type="module">
import { db, doc, getDoc, getDocs, setDoc, collection, query, where } from "./firebase.js";

let taps=0;
document.getElementById('secretLogo').addEventListener('click',()=>{
 taps++;
 if(taps>=5){ window.location.href='admin-login.html'; }
 setTimeout(()=>taps=0,2500);
});

window.showSignup = function(){ loginBox.classList.add('hidden'); signupBox.classList.remove('hidden'); }
window.showLogin = function(){ signupBox.classList.add('hidden'); loginBox.classList.remove('hidden'); }

window.signup = async function(){
 let n=document.getElementById('s_name').value.trim(),
     u=document.getElementById('s_user').value.trim(),
     m=document.getElementById('s_mobile').value.trim(),
     e=document.getElementById('s_email').value.trim(),
     p=document.getElementById('s_pass').value.trim(),
     er=document.getElementById('signupErr');

 if(!n||!u||!m||!e||!p){ er.textContent='Please fill all fields'; er.classList.add('show'); return; }
 if(m.length!=10){ er.textContent='Mobile must be 10 digits'; er.classList.add('show'); return; }
 if(p.length<6){ er.textContent='Password min 6 chars'; er.classList.add('show'); return; }

 er.textContent='Creating account...'; er.classList.add('show'); er.style.background='rgba(18,42,24,.88)'; er.style.borderColor='#2a5a30'; er.style.color='#b4ffb4';

 try{
   // username check
   let docRef = doc(db, "users", u);
   let docSnap = await getDoc(docRef);
   if(docSnap.exists()){ er.style.background='rgba(42,18,24,.88)'; er.style.borderColor='#5a2a30'; er.style.color='#ffb4b4'; er.textContent='Username already exists'; return; }

   // email check
   let q = query(collection(db, "users"), where("email","==",e.toLowerCase()));
   let qSnap = await getDocs(q);
   if(!qSnap.empty){ er.style.background='rgba(42,18,24,.88)'; er.style.borderColor='#5a2a30'; er.style.color='#ffb4b4'; er.textContent='Email already exists'; return; }

   await setDoc(docRef, {
     name:n, username:u, mobile:m, email:e.toLowerCase(), pass:p,
     total:0, level:1, locked:false,
     cardNum: Math.floor(1000+Math.random()*9000)+' '+Math.floor(1000+Math.random()*9000)+' '+Math.floor(1000+Math.random()*9000)+' '+Math.floor(1000+Math.random()*9000),
     createdAt: Date.now()
   });

   alert('Account created! Now Login'); 
   window.showLogin();
   er.classList.remove('show');
 }catch(err){ er.textContent=err.message; er.style.background='rgba(42,18,24,.88)'; }
}

window.login = async function(){
 let e=document.getElementById('email').value.trim().toLowerCase(),
     p=document.getElementById('password').value.trim(),
     er=document.getElementById('loginErr');

 if(!e||!p){ er.textContent='Fill Email & Password'; er.classList.add('show'); return; }
 er.textContent='Checking...'; er.classList.add('show'); er.style.background='rgba(18,42,24,.88)'; er.style.borderColor='#2a5a30'; er.style.color='#b4ffb4';

 try{
   let usersSnap = await getDocs(collection(db, "users"));
   let f = null;
   usersSnap.forEach(d=>{
     let data=d.data();
     if((data.email.toLowerCase()===e || data.username.toLowerCase()===e) && data.pass===p) f=data;
   });

   if(!f){ er.style.background='rgba(42,18,24,.88)'; er.style.borderColor='#5a2a30'; er.style.color='#ffb4b4'; er.textContent='Wrong Email or Password'; return; }

   if(f.locked){ er.style.background='rgba(42,18,24,.88)'; er.textContent='Account Locked by Admin'; return; }

   localStorage.setItem('aura_current', JSON.stringify(f));

   // 999+ request auto create in Firebase
   if(f.level>=999){
     await setDoc(doc(db, "requests", f.username), {name:f.name, username:f.username, email:f.email, level:f.level, time:Date.now()});
   }

   window.location.href='./welcome.html';
 }catch(err){ er.textContent=err.message; }
}
</script>
</body>
</html>
