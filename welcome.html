<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome - NOWSHINEYOURAURA</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:#0a0614 url('bg.jpg') no-repeat center center/cover;
  font-family:'Inter',sans-serif;
  display:flex;flex-direction:column;
}
.top{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;
  background:linear-gradient(180deg, rgba(0,0,0,0.4), transparent);
}
.logo{
  font-family:'Orbitron',sans-serif;
  color:#d8b4fe;font-size:16px;font-weight:700;letter-spacing:1px;
  text-shadow:0 0 12px #a855f7, 0 0 24px #7c3aed;
  max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.logout{
  padding:8px 16px;border-radius:20px;
  background:rgba(0,0,0,0.35);
  border:1.2px solid rgba(168,85,247,0.8);
  color:#e9d5ff;font-size:12px;
  box-shadow:0 0 10px rgba(168,85,247,0.4);
  backdrop-filter:blur(10px);cursor:pointer;
}
.center{
  flex:1;display:flex;justify-content:center;align-items:center;
  padding:10px 16px 30px;
}
.card{
  width:340px;max-width:92vw;
  background:rgba(255,255,255,0.10);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-radius:24px;padding:28px 20px 22px;
  border:1.5px solid rgba(216,180,254,0.6);
  box-shadow:0 0 30px rgba(168,85,247,0.45), inset 0 0 20px rgba(255,255,255,0.08);
  text-align:center;position:relative;
}
.card::before{
  content:'';position:absolute;inset:10px;
  border:1px solid rgba(255,255,255,0.12);border-radius:16px;pointer-events:none;
}
.star{color:#f5e6ff;text-shadow:0 0 14px #fff, 0 0 28px #a855f7;font-size:30px;line-height:1}
.star.small{font-size:16px;letter-spacing:8px;margin-top:8px;opacity:0.9}
h1{color:#fff;font-size:38px;font-weight:800;margin-top:22px;letter-spacing:-0.5px}
.sub{color:#d8b4fe;font-size:16px;margin-top:8px;font-weight:400}
.line{height:1px;margin:20px 10px;background:linear-gradient(90deg,transparent,#d8b4fe,transparent);position:relative}
.line::after{
  content:'✦';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:#3a1d5e;color:#e9d5ff;font-size:11px;padding:0 10px;
  box-shadow:0 0 10px #a855f7;border-radius:4px;
}
.text{
  color:#e9d5ff;
  font-size:13px;line-height:1.6;margin-top:16px;font-weight:500;
  text-shadow:0 0 8px rgba(216,180,254,0.6);
}
.btn{
  margin-top:22px;width:100%;height:48px;
  background:linear-gradient(180deg,#8b5cf6,#7c3aed);
  border:1px solid #c4b5fd;border-radius:12px;
  color:#fff;font-size:14px;font-weight:600;
  box-shadow:0 0 18px rgba(139,92,246,0.8);
  cursor:pointer;
}
</style>
</head>
<body>
<div class="top">
<div class="logo">NOWSHINEYOURAURA</div>
<button class="logout" onclick="logout()">↩ Logout</button>
</div>

<div class="center">
<div class="card">
<div class="star">✦</div>
<div class="star small">✦ &nbsp; ✦</div>
<h1>Welcome</h1>
<div class="sub">Your Aura is Shining</div>
<div class="line"></div>
<div class="text" id="welcomeText">Your energy is now active •<br>Premium Aura Unlocked</div>
<button class="btn" onclick="location.href='dashboard.html'">Continue to Aura Dashboard</button>
</div>
</div>

<script type="module">
import "./firebase.js";
// Session check - same logic
let cur = JSON.parse(localStorage.getItem('aura_current')||'null');
if(!cur){ location.href='index.html'; }
else{
  document.getElementById('welcomeText').innerHTML = `Hello <b>${cur.name}</b> •<br>Your energy is now active • Premium Aura Unlocked`;
}
window.logout = function(){
  localStorage.removeItem('aura_current');
  location.href='index.html';
}
</script>
</body>
</html>
